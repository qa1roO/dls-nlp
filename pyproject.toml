[project]
name = "dls-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gensim>=4.4.0",
    "nbconvert[webpdf]>=7.17.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "torch>=2.8.0",
    "datasets>=4.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

# PyTorch with CUDA 12.8 wheels (needed for RTX 50xx / Blackwell, sm_120)
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Resolve only for the platform actually used (skips unneeded wheel metadata fetches)
[tool.uv]
environments = ["sys_platform == 'win32'"]
